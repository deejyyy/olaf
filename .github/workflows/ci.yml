name: C++ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake

    - name: Build
      run: |
        mkdir -p build
        cd build
        cmake ..
        cmake --build .

    - name: Run
      run: ./build/hello

    - name: Clean
      run: rm -rf build
